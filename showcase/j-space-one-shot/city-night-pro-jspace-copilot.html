<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>霓虹都市 · 城市之夜</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#03050c;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;z-index:3;left:26px;top:24px;color:#e7edff;pointer-events:none;user-select:none;text-shadow:0 2px 18px rgba(0,0,0,.75)}
  #hud h1{margin:0;font-size:26px;font-weight:600;letter-spacing:8px;color:#fff}
  #hud h1 em{font-style:normal;color:#ff8ac2}
  #hud p{margin:7px 0 0;font-size:12px;letter-spacing:4px;color:#8fa0c9}
  #clock{position:fixed;z-index:3;right:30px;top:26px;color:#c9d6ff;font-size:15px;letter-spacing:4px;pointer-events:none;user-select:none;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  #hint{position:fixed;z-index:3;left:50%;bottom:24px;transform:translateX(-50%);color:#9aa9cf;font-size:12px;letter-spacing:3px;pointer-events:none;user-select:none;text-shadow:0 1px 8px rgba(0,0,0,.8);transition:opacity 1.5s ease}
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 46%,rgba(1,2,10,.58) 100%)}
  #loading{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(120% 120% at 50% 30%,#0b1226 0%,#03050c 62%);color:#c8d4ff;transition:opacity .9s ease}
  #loading .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.14);border-top-color:#ff9d5c;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>正在点亮城市…</div></div>
<div id="vignette"></div>
<div id="hud"><h1>霓虹<em>都市</em></h1><p>NEON CITY · NIGHT</p></div>
<div id="clock">21:47</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 自动漫游</div>

<script>
'use strict';

// 收集运行时错误，便于排查
window.__pageErrors = [];
window.addEventListener('error', function (e) {
  window.__pageErrors.push(String((e.message || '') + (e.filename ? ' @' + e.filename : '')));
});

var CDN_URLS = [
  'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js',
  'https://unpkg.com/three@0.152.2/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js'
];

function loadFailed() {
  var el = document.getElementById('loading');
  el.style.transition = 'none';
  el.innerHTML = '<div style="max-width:520px;line-height:2;text-align:center;padding:0 24px">无法加载 Three.js，请检查网络连接后重新打开本文件。<br><span style="color:#8fa0c9;font-size:12px">该页面通过 CDN 引入 three.js，需要联网。</span></div>';
}

function bootThree(i) {
  if (!window.THREE) {
    if (i >= CDN_URLS.length) { loadFailed(); return; }
    var s = document.createElement('script');
    s.src = CDN_URLS[i];
    s.onload = function () {
      if (window.THREE) { start(); } else { bootThree(i + 1); }
    };
    s.onerror = function () { bootThree(i + 1); };
    document.head.appendChild(s);
  } else {
    start();
  }
}

function start() {
  try {
    initScene();
  } catch (err) {
    if (window.console) { console.error(err); }
    window.__pageErrors.push('init: ' + err.message);
    var el = document.getElementById('loading');
    el.style.transition = 'none';
    el.innerHTML = '<div style="text-align:center;line-height:2">场景初始化失败：' + err.message + '</div>';
  }
}

function initScene() {
  var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x03050e);
  scene.fog = new THREE.FogExp2(0x0a1024, 0.0052);

  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 1600);

  // ---------- 天空 ----------
  var skyGeo = new THREE.SphereGeometry(700, 32, 15);
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    toneMapped: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x040817) },
      bottomColor: { value: new THREE.Color(0x2e3d6b) },
      offset: { value: 10 },
      exponent: { value: 0.62 }
    },
    vertexShader: [
      'varying vec3 vWorldPosition;',
      'void main(){',
      '  vec4 wp = modelMatrix * vec4(position,1.0);',
      '  vWorldPosition = wp.xyz;',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 topColor;',
      'uniform vec3 bottomColor;',
      'uniform float offset;',
      'uniform float exponent;',
      'varying vec3 vWorldPosition;',
      'void main(){',
      '  float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;',
      '  float t = max(pow(max(h, 0.0), exponent), 0.0);',
      '  gl_FragColor = vec4(mix(bottomColor, topColor, t), 1.0);',
      '}'
    ].join('\n')
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // ---------- 灯光 ----------
  scene.add(new THREE.HemisphereLight(0x34416f, 0x0a0c14, 0.9));
  var moonLight = new THREE.DirectionalLight(0x9db4ff, 0.5);
  moonLight.position.set(-80, 80, -130);
  var moonTarget = new THREE.Object3D();
  moonTarget.position.set(0, 0, 0);
  scene.add(moonTarget);
  moonLight.target = moonTarget;
  scene.add(moonLight);

  // ---------- 星空 ----------
  var starCount = 1300;
  var starPos = new Float32Array(starCount * 3);
  var starCol = new Float32Array(starCount * 3);
  var starCols = [new THREE.Color(0xdfe8ff), new THREE.Color(0xfff2cf), new THREE.Color(0x9fc4ff), new THREE.Color(0xffffff)];
  for (var si = 0; si < starCount; si++) {
    var sr = 440 + Math.random() * 180;
    var sy = 0.12 + Math.random() * 0.88;
    var ang = Math.random() * Math.PI * 2;
    var sx = Math.sqrt(1 - sy * sy) * Math.cos(ang);
    var sz = Math.sqrt(1 - sy * sy) * Math.sin(ang);
    starPos[si * 3] = sx * sr;
    starPos[si * 3 + 1] = sy * sr;
    starPos[si * 3 + 2] = sz * sr;
    var sc = starCols[(Math.random() * starCols.length) | 0];
    starCol[si * 3] = sc.r; starCol[si * 3 + 1] = sc.g; starCol[si * 3 + 2] = sc.b;
  }
  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
  var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    size: 2.6, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(stars);

  // ---------- 月亮 ----------
  function makeMoonTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(128, 128, 20, 128, 128, 128);
    grd.addColorStop(0, 'rgba(238,244,255,1)');
    grd.addColorStop(0.42, 'rgba(214,228,255,0.96)');
    grd.addColorStop(0.62, 'rgba(150,172,226,0.35)');
    grd.addColorStop(1, 'rgba(120,140,200,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
    g.fillStyle = 'rgba(196,212,246,0.55)';
    [[112, 104, 16], [138, 132, 11], [104, 140, 9], [150, 108, 7]].forEach(function (p) {
      g.beginPath(); g.arc(p[0], p[1], p[2], 0, Math.PI * 2); g.fill();
    });
    return new THREE.CanvasTexture(c);
  }
  var moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeMoonTexture(), transparent: true, depthWrite: false, fog: false
  }));
  moonSprite.position.set(-80, 80, -130);
  moonSprite.scale.set(64, 64, 1);
  scene.add(moonSprite);

  function makeGlowTexture(r, g, b) {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var ctx = c.getContext('2d');
    var grd = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
    grd.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
    grd.addColorStop(0.3, 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
    grd.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  var moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTexture(160, 190, 255), transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  moonHalo.position.copy(moonSprite.position);
  moonHalo.scale.set(190, 190, 1);
  scene.add(moonHalo);

  // ---------- 地面 ----------
  var ROADS = [-55, -33, -11, 11, 33, 55];
  function makeGroundTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 1024;
    var g = c.getContext('2d');
    var WORLD = 320, S = 1024 / WORLD;
    g.fillStyle = '#070911'; g.fillRect(0, 0, 1024, 1024);
    for (var gx = -3; gx <= 3; gx++) {
      for (var gz = -3; gz <= 3; gz++) {
        var bx = (gx * 22 - 8 + 160) * S, bz = (gz * 22 - 8 + 160) * S;
        g.fillStyle = '#1c2335';
        g.fillRect(bx, bz, 16 * S, 16 * S);
        g.strokeStyle = '#3a4a6b'; g.lineWidth = 2;
        g.strokeRect(bx, bz, 16 * S, 16 * S);
      }
    }
    for (var i = 0; i < 9000; i++) {
      g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.025).toFixed(3) + ')';
      g.fillRect(Math.random() * 1024, Math.random() * 1024, 1.4, 1.4);
    }
    g.fillStyle = '#0c0f1a';
    ROADS.forEach(function (x) {
      g.fillRect((x - 3 + 160) * S, 0, 6 * S, 1024);
    });
    ROADS.forEach(function (z) {
      g.fillRect(0, (z - 3 + 160) * S, 1024, 6 * S);
    });
    g.fillStyle = 'rgba(244,206,102,0.22)';
    ROADS.forEach(function (x) {
      var px = (x + 160) * S;
      for (var t = -160; t < 160; t += 9) {
        g.fillRect(px - 1.1 * S, (t + 160) * S, 2.2 * S, 4.2 * S);
      }
    });
    ROADS.forEach(function (z) {
      var py = (z + 160) * S;
      for (var t = -160; t < 160; t += 9) {
        g.fillRect((t + 160) * S, py - 1.1 * S, 4.2 * S, 2.2 * S);
      }
    });
    g.fillStyle = '#f5d06a';
    ROADS.forEach(function (x) {
      var px = (x + 160) * S;
      for (var t = -160; t < 160; t += 9) {
        g.fillRect(px - 0.35 * S, (t + 160) * S, 0.7 * S, 4.2 * S);
      }
    });
    ROADS.forEach(function (z) {
      var py = (z + 160) * S;
      for (var t = -160; t < 160; t += 9) {
        g.fillRect((t + 160) * S, py - 0.35 * S, 4.2 * S, 0.7 * S);
      }
    });
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    return tex;
  }
  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(320, 320),
    new THREE.MeshLambertMaterial({ map: makeGroundTexture(), color: 0xffffff })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // ---------- 建筑 ----------
  var windowTextures = [];
  for (var wt = 0; wt < 6; wt++) { windowTextures.push(makeWindowTexture()); }

  function makeWindowTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d');
    g.fillStyle = '#0c1120'; g.fillRect(0, 0, 128, 128);
    for (var i = 0; i < 300; i++) {
      g.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.25).toFixed(3) + ')';
      g.fillRect(Math.random() * 128, Math.random() * 128, 1.8, 1.8);
    }
    var warm = ['#ffc46b', '#ffd896', '#ffaf57', '#ffe0a0'];
    var cool = ['#9fdcff', '#79c8ff'];
    var pink = ['#ff9f8a', '#ffb8c9'];
    for (var by = 0; by < 2; by++) {
      for (var bx = 0; bx < 2; bx++) {
        var px = bx * 64, py = by * 64;
        var lit = Math.random() < 0.40;
        g.fillStyle = '#080d18'; g.fillRect(px + 13, py + 12, 38, 42);
        if (lit) {
          var pick = Math.random();
          var col = pick < 0.72 ? warm[(Math.random() * warm.length) | 0]
            : pick < 0.88 ? cool[(Math.random() * cool.length) | 0]
            : pink[(Math.random() * pink.length) | 0];
          g.fillStyle = col; g.fillRect(px + 13, py + 12, 38, 42);
          var grd = g.createLinearGradient(0, py + 12, 0, py + 54);
          grd.addColorStop(0, 'rgba(255,255,255,0.34)');
          grd.addColorStop(0.5, 'rgba(255,255,255,0.06)');
          grd.addColorStop(1, 'rgba(0,0,0,0.32)');
          g.fillStyle = grd; g.fillRect(px + 13, py + 12, 38, 42);
        } else {
          g.fillStyle = 'rgba(140,170,220,0.08)'; g.fillRect(px + 20, py + 18, 24, 30);
        }
        g.strokeStyle = 'rgba(4,8,18,0.95)'; g.lineWidth = 2;
        g.strokeRect(px + 13, py + 12, 38, 42);
        g.beginPath(); g.moveTo(px + 32, py + 12); g.lineTo(px + 32, py + 54); g.stroke();
        g.beginPath(); g.moveTo(px + 13, py + 33); g.lineTo(px + 51, py + 33); g.stroke();
      }
    }
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  var buildings = [];
  var neonBarColors = [0xff4f9e, 0x41e0ff, 0xffb347, 0x8d7bff, 0x7dffb8];
  var maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  function makeBuilding(w, h, d, x, z) {
    var geo = new THREE.BoxGeometry(w, h, d);
    var uv = geo.attributes.uv;
    for (var i = 8; i < 16; i++) { uv.setXY(i, 0.03, 0.03); }
    uv.needsUpdate = true;
    var tex = windowTextures[(Math.random() * windowTextures.length) | 0].clone();
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(
      THREE.MathUtils.clamp(Math.round(w / 1.8), 2, 14) / 2,
      THREE.MathUtils.clamp(Math.round(h / 2.8), 2, 36) / 2
    );
    tex.anisotropy = maxAniso;
    tex.needsUpdate = true;
    var color = new THREE.Color().setHSL(0.58 + Math.random() * 0.14, 0.28, 0.16 + Math.random() * 0.08);
    var mat = new THREE.MeshLambertMaterial({
      map: tex, color: color, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 1.05
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, h / 2, z);
    scene.add(mesh);
    if (h > 24 && Math.random() < 0.55) {
      var bar = new THREE.Mesh(
        new THREE.BoxGeometry(w + 0.9, 0.35, 0.4),
        new THREE.MeshBasicMaterial({ color: neonBarColors[(Math.random() * neonBarColors.length) | 0] })
      );
      bar.position.set(x, h + 0.15, z);
      scene.add(bar);
    }
    return { mesh: mesh, w: w, h: h, d: d, x: x, z: z };
  }

  function addBuilding(w, h, d, x, z) {
    buildings.push(makeBuilding(w, h, d, x, z));
  }
  for (var gx = -3; gx <= 3; gx++) {
    for (var gz = -3; gz <= 3; gz++) {
      var cx = gx * 22, cz = gz * 22;
      if (gx === 0 && gz === 0) { continue; }
      var distC = Math.sqrt(cx * cx + cz * cz);
      var layout = Math.random();
      var jitter = function () { return (Math.random() - 0.5) * 0.8; };
      if (layout < 0.45) {
        // 2x2 细塔楼街区
        for (var ly = 0; ly < 2; ly++) {
          for (var lx = 0; lx < 2; lx++) {
            var w = 4.2 + Math.random() * 1.3;
            var d = 4.2 + Math.random() * 1.3;
            var h = 12 + Math.random() * 14 + (1 - Math.min(distC / 105, 1)) * 34;
            if (distC < 30) { h += 6 + Math.random() * 8; }
            h = THREE.MathUtils.clamp(h, 10, 52);
            addBuilding(w, h, d, cx + (lx ? 3.3 : -3.3) + jitter(), cz + (ly ? 3.3 : -3.3) + jitter());
          }
        }
      } else if (layout < 0.72) {
        // 双条板楼
        for (var side = -1; side <= 1; side += 2) {
          var w2 = 4.6 + Math.random() * 1.4;
          var d2 = 7.6 + Math.random() * 1.6;
          var h2 = 14 + Math.random() * 10 + (1 - Math.min(distC / 105, 1)) * 20;
          h2 = THREE.MathUtils.clamp(h2, 12, 40);
          addBuilding(w2, h2, d2, cx + side * 3.7 + jitter(), cz + jitter() * 0.4);
        }
      } else {
        // 单栋大体量楼
        var w3 = 6.6 + Math.random() * 2.2;
        var d3 = 6.6 + Math.random() * 2.2;
        var h3 = 20 + Math.random() * 14 + (1 - Math.min(distC / 105, 1)) * 26;
        if (distC < 30) { h3 += 10 + Math.random() * 10; }
        h3 = THREE.MathUtils.clamp(h3, 18, 58);
        addBuilding(w3, h3, d3, cx + jitter() * 0.5, cz + jitter() * 0.5);
      }
    }
  }

  // 中心地标塔
  var towerTex = windowTextures[(Math.random() * windowTextures.length) | 0].clone();
  towerTex.wrapS = towerTex.wrapT = THREE.RepeatWrapping;
  towerTex.repeat.set(4, 13);
  towerTex.anisotropy = maxAniso;
  towerTex.needsUpdate = true;
  var towerGeo = new THREE.BoxGeometry(14, 72, 14);
  var towerUV = towerGeo.attributes.uv;
  for (var ti = 8; ti < 16; ti++) { towerUV.setXY(ti, 0.03, 0.03); }
  towerUV.needsUpdate = true;
  var towerMat = new THREE.MeshLambertMaterial({
    map: towerTex, color: new THREE.Color(0x182033), emissive: 0xffffff, emissiveMap: towerTex, emissiveIntensity: 1.1
  });
  var tower = new THREE.Mesh(towerGeo, towerMat);
  tower.position.set(0, 36, 0);
  scene.add(tower);
  var crown = new THREE.Mesh(
    new THREE.BoxGeometry(15, 1.4, 15),
    new THREE.MeshBasicMaterial({ color: 0xff4f9e })
  );
  crown.position.set(0, 72.7, 0);
  scene.add(crown);
  var antenna = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.14, 9, 6),
    new THREE.MeshBasicMaterial({ color: 0x2a3550 })
  );
  antenna.position.set(0, 77, 0);
  scene.add(antenna);

  // 霓虹招牌
  function makeSignTexture(text, color) {
    var c = document.createElement('canvas'); c.width = 512; c.height = 128;
    var g = c.getContext('2d');
    g.clearRect(0, 0, 512, 128);
    g.font = 'bold 78px "Microsoft YaHei", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = color; g.shadowBlur = 30;
    g.fillStyle = color; g.fillText(text, 256, 64);
    g.shadowBlur = 12; g.fillText(text, 256, 64);
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillText(text, 256, 60);
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  var signDefs = [
    { text: '霓虹', color: '#ff4fa3' },
    { text: 'CITY', color: '#41d9ff' },
    { text: 'BAR', color: '#ffb347' },
    { text: '24H', color: '#8dffb0' },
    { text: 'HOTEL', color: '#8d7bff' },
    { text: 'STAR', color: '#ff6a4f' }
  ];
  function makeSignGroup(text, color, w, h, x, y, z, rotY) {
    var group = new THREE.Group();
    var geo = new THREE.PlaneGeometry(w, h);
    function frontMat() {
      return new THREE.MeshBasicMaterial({
        map: makeSignTexture(text, color), transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.FrontSide
      });
    }
    var front = new THREE.Mesh(geo, frontMat());
    front.position.z = 0.06;
    var back = new THREE.Mesh(geo, frontMat());
    back.rotation.y = Math.PI;
    back.position.z = -0.06;
    group.add(front);
    group.add(back);
    group.position.set(x, y, z);
    group.rotation.y = rotY;
    scene.add(group);
    return group;
  }
  var signList = [];
  var tallBuildings = buildings.filter(function (b) { return b.h > 26; });
  for (var sn = 0; sn < Math.min(6, tallBuildings.length); sn++) {
    var b = tallBuildings[Math.floor(sn * tallBuildings.length / 6)];
    var def = signDefs[sn];
    signList.push({ mesh: makeSignGroup(def.text, def.color, 8.6, 2.15, b.x, b.h + 1.6, b.z, (sn % 2) * Math.PI / 2) });
  }
  makeSignGroup('霓虹都市', '#ff5aa8', 10, 2.6, 0, 58, 7.06, 0);
  makeSignGroup('NEON', '#46d5ff', 10, 2.6, 7.06, 58, 0, Math.PI / 2);

  // 塔顶闪烁信标
  var beaconTex = makeGlowTexture(255, 70, 80);
  var beacon = new THREE.Sprite(new THREE.SpriteMaterial({
    map: beaconTex, color: 0xff4050, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  beacon.position.set(0, 82, 0);
  beacon.scale.set(10, 10, 1);
  scene.add(beacon);

  // ---------- 路灯 ----------
  var lamps = [];
  ROADS.forEach(function (rx) {
    ROADS.forEach(function (rz) { lamps.push({ x: rx, z: rz }); });
  });
  var poleGeo = new THREE.CylinderGeometry(0.12, 0.18, 7, 6);
  var poleMat = new THREE.MeshLambertMaterial({ color: 0x1c2333 });
  var poles = new THREE.InstancedMesh(poleGeo, poleMat, lamps.length);
  var headGeo = new THREE.SphereGeometry(0.34, 8, 8);
  var headMat = new THREE.MeshBasicMaterial({ color: 0xffdcae });
  var lampHeads = new THREE.InstancedMesh(headGeo, headMat, lamps.length);
  var haloTex = makeGlowTexture(255, 190, 120);
  var m4 = new THREE.Matrix4(), q0 = new THREE.Quaternion(), s1 = new THREE.Vector3(1, 1, 1), vtmp = new THREE.Vector3();
  lamps.forEach(function (p, i) {
    m4.compose(vtmp.set(p.x, 3.5, p.z), q0, s1);
    poles.setMatrixAt(i, m4);
    m4.compose(vtmp.set(p.x, 7.15, p.z), q0, s1);
    lampHeads.setMatrixAt(i, m4);
    var halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: haloTex, color: 0xffc37e, transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    halo.position.set(p.x, 7.3, p.z);
    halo.scale.set(7, 7, 1);
    scene.add(halo);
    if (i % 4 === 0) {
      var pl = new THREE.PointLight(0xffb36b, 1.5, 36, 1.7);
      pl.position.set(p.x, 6.4, p.z);
      scene.add(pl);
    }
  });
  poles.instanceMatrix.needsUpdate = true;
  lampHeads.instanceMatrix.needsUpdate = true;
  scene.add(poles);
  scene.add(lampHeads);

  // ---------- 车流 ----------
  var CAR_COUNT = 44;
  var carData = [];
  var dummy = new THREE.Object3D();
  var one = new THREE.Vector3(1, 1, 1);
  var hlPos = new THREE.Vector3(), tlPos = new THREE.Vector3();
  for (var ci = 0; ci < CAR_COUNT; ci++) {
    var dir = Math.random() < 0.5 ? 0 : 1;
    var sign = Math.random() < 0.5 ? 1 : -1;
    carData.push({
      dir: dir,
      sign: sign,
      road: ROADS[(Math.random() * ROADS.length) | 0] + (Math.random() < 0.5 ? -1.6 : 1.6),
      speed: 7 + Math.random() * 7,
      offset: Math.random() * 320,
      rotY: dir === 0 ? (sign > 0 ? -Math.PI / 2 : Math.PI / 2) : (sign > 0 ? Math.PI : 0)
    });
  }
  var carGeo = new THREE.BoxGeometry(1.8, 1.0, 4.0);
  var carMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  var carBodies = new THREE.InstancedMesh(carGeo, carMat, CAR_COUNT);
  var hlGeo = new THREE.BoxGeometry(0.34, 0.3, 0.3);
  var hlMat = new THREE.MeshBasicMaterial({ color: 0xfff3c4 });
  var carHeadlights = new THREE.InstancedMesh(hlGeo, hlMat, CAR_COUNT * 2);
  var tlMat = new THREE.MeshBasicMaterial({ color: 0xff4138 });
  var carTaillights = new THREE.InstancedMesh(hlGeo, tlMat, CAR_COUNT * 2);
  var carPalette = [0x3a4a68, 0x5a3348, 0x2f4d55, 0x665a3a, 0x4a3f66, 0x23364d, 0x6b4030];
  var tmpColor = new THREE.Color();
  for (var cj = 0; cj < CAR_COUNT; cj++) {
    tmpColor.setHex(carPalette[(Math.random() * carPalette.length) | 0]);
    carBodies.setColorAt(cj, tmpColor);
  }
  if (carBodies.instanceColor) { carBodies.instanceColor.needsUpdate = true; }
  scene.add(carBodies);
  scene.add(carHeadlights);
  scene.add(carTaillights);

  // ---------- 雨 ----------
  var RAIN_COUNT = 1000;
  var rainPositions = new Float32Array(RAIN_COUNT * 3);
  for (var ri = 0; ri < RAIN_COUNT; ri++) {
    rainPositions[ri * 3] = (Math.random() * 2 - 1) * 165;
    rainPositions[ri * 3 + 1] = Math.random() * 95;
    rainPositions[ri * 3 + 2] = (Math.random() * 2 - 1) * 165;
  }
  var rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
  var rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({
    color: 0x9db6ff, size: 0.16, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(rain);

  // ---------- 相机与交互 ----------
  var camState = { theta: 0.65, phi: 1.36, radius: 102, target: new THREE.Vector3(0, 13, 0) };
  var velTheta = 0, velPhi = 0;
  var pointers = new Map();
  var pinchDist = 0;
  var autoTheta = 0.0016;

  function updateCamera() {
    var p = new THREE.Vector3().setFromSphericalCoords(camState.radius, camState.phi, camState.theta);
    camera.position.copy(camState.target).add(p);
    camera.lookAt(camState.target);
  }

  var dom = renderer.domElement;
  dom.addEventListener('pointerdown', function (e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (dom.setPointerCapture) { try { dom.setPointerCapture(e.pointerId); } catch (err) {} }
    if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
  });
  dom.addEventListener('pointermove', function (e) {
    var p = pointers.get(e.pointerId);
    if (!p) { return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) {
      camState.theta -= dx * 0.005;
      camState.phi = THREE.MathUtils.clamp(camState.phi - dy * 0.004, 0.42, 1.48);
      velTheta = -dx * 0.0004; velPhi = -dy * 0.0003;
    } else if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchDist > 0) {
        camState.radius = THREE.MathUtils.clamp(camState.radius * pinchDist / Math.max(d, 1), 38, 230);
      }
      pinchDist = d;
    }
  });
  function releasePointer(e) {
    pointers.delete(e.pointerId);
    pinchDist = 0;
  }
  dom.addEventListener('pointerup', releasePointer);
  dom.addEventListener('pointercancel', releasePointer);
  dom.addEventListener('wheel', function (e) {
    e.preventDefault();
    camState.radius = THREE.MathUtils.clamp(camState.radius * (1 + e.deltaY * 0.0011), 38, 230);
  }, { passive: false });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- 动画循环 ----------
  var clock = new THREE.Clock();
  var firstFrame = true;
  var hintTimer = 0;

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    if (!pointers.size) {
      camState.theta += autoTheta;
      camState.theta += velTheta;
      camState.phi = THREE.MathUtils.clamp(camState.phi + velPhi, 0.42, 1.48);
      velTheta *= 0.94; velPhi *= 0.94;
    }
    updateCamera();

    // 车辆
    var m = new THREE.Matrix4();
    for (var i = 0; i < CAR_COUNT; i++) {
      var c = carData[i];
      var travel = ((t * c.speed + c.offset) % 320) - 160;
      var px, pz;
      if (c.dir === 0) { px = travel * c.sign; pz = c.road; }
      else { px = c.road; pz = travel * c.sign; }
      dummy.position.set(px, 0.85, pz);
      dummy.rotation.set(0, c.rotY, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      carBodies.setMatrixAt(i, dummy.matrix);
      hlPos.set(-0.62, 0.38, -2.06).applyMatrix4(dummy.matrix);
      m.compose(hlPos, dummy.quaternion, one);
      carHeadlights.setMatrixAt(i * 2, m);
      hlPos.set(0.62, 0.38, -2.06).applyMatrix4(dummy.matrix);
      m.compose(hlPos, dummy.quaternion, one);
      carHeadlights.setMatrixAt(i * 2 + 1, m);
      tlPos.set(-0.58, 0.38, 2.06).applyMatrix4(dummy.matrix);
      m.compose(tlPos, dummy.quaternion, one);
      carTaillights.setMatrixAt(i * 2, m);
      tlPos.set(0.58, 0.38, 2.06).applyMatrix4(dummy.matrix);
      m.compose(tlPos, dummy.quaternion, one);
      carTaillights.setMatrixAt(i * 2 + 1, m);
    }
    carBodies.instanceMatrix.needsUpdate = true;
    carHeadlights.instanceMatrix.needsUpdate = true;
    carTaillights.instanceMatrix.needsUpdate = true;

    // 雨
    var rp = rainGeo.attributes.position.array;
    for (var j = 0; j < RAIN_COUNT; j++) {
      rp[j * 3 + 1] -= (7.5 + (j % 10) * 0.35) * dt;
      rp[j * 3] += Math.sin(t * 0.9 + j * 0.7) * 0.35 * dt;
      if (rp[j * 3 + 1] < 0) {
        rp[j * 3 + 1] = 90 + Math.random() * 6;
        rp[j * 3] = (Math.random() * 2 - 1) * 165;
        rp[j * 3 + 2] = (Math.random() * 2 - 1) * 165;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;

    // 信标与招牌闪烁
    beacon.material.opacity = 0.45 + 0.55 * Math.abs(Math.sin(t * 2.2));
    for (var k = 0; k < signList.length; k++) {
      var fl = Math.sin(t * 1.7 + k * 2.1);
      var op = 0.82 + 0.18 * (fl > 0.4 ? 1 : fl * 1.4);
      signList[k].mesh.children.forEach(function (child) { child.material.opacity = op; });
    }

    renderer.render(scene, camera);

    if (firstFrame) {
      firstFrame = false;
      var loading = document.getElementById('loading');
      loading.style.opacity = '0';
      setTimeout(function () { if (loading.parentNode) { loading.parentNode.removeChild(loading); } }, 1000);
    }
    hintTimer += dt;
    if (hintTimer > 8) {
      var hint = document.getElementById('hint');
      if (hint.style.opacity !== '0') { hint.style.opacity = '0'; }
    }
  }
  updateCamera();
  animate();
}

bootThree(0);
</script>
